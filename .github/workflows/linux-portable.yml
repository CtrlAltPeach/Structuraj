name: Linux portable

# AppImage — портативный формат под Linux: один файл, chmod +x, запуск.
# Собирать надо на 22.04: Tauri v2 требует webkit2gtk-4.1, и бинарник,
# собранный на 24.04, на 22.04 уже не пойдёт. Обратное работает.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза, куда приложить сборку (пусто — только артефакт)"
        default: v0.2.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Проверить типы
        run: npx tsc --noEmit

      # Единственная доступная проверка Linux без самой Linux-машины:
      # ядро на настоящей системе.
      - name: Тесты ядра на Linux
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Собрать фронтенд
        run: npm run build

      - name: Собрать AppImage
        run: npm run tauri build -- --bundles appimage

      - name: Переименовать под общую схему
        id: name
        run: |
          SRC=$(find src-tauri/target -name "*.AppImage" -type f | head -1)
          if [ -z "$SRC" ]; then echo "::error::AppImage не найден"; exit 1; fi
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT="Structuraj_${VERSION}_linux-x86_64-portable.AppImage"
          mv "$SRC" "$OUT"
          chmod +x "$OUT"
          ls -lh "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Structuraj-linux-portable
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      - name: Приложить к релизу
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            "${{ steps.name.outputs.file }}" --clobber
          echo "выложено в релиз ${{ inputs.release_tag }}"
